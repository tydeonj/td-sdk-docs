name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Install and build
        working-directory: docs-site
        run: |
          npm install
          npm run docs:build
          touch .vitepress/dist/.nojekyll
          cp .vitepress/dist/index.html .vitepress/dist/404.html || true
      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs-site/.vitepress/dist
          branch: gh-pages
          clean: true
